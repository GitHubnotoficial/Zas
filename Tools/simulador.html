<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zas: simulador</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#000}
body{font:13px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",sans-serif;color:var(--t);-webkit-font-smoothing:antialiased}
:root{--t:#1d1d1f;--m:rgba(29,29,31,.56);--glass:rgba(255,255,255,.58);--solid:#f6f6f8;--edge:rgba(255,255,255,.72);--line:rgba(0,0,0,.1);--hov:rgba(0,0,0,.07);--acc:#0a84ff;--bar:rgba(255,255,255,.36);--under:rgba(236,236,242,.72)}
body.dark{--t:#f5f5f7;--m:rgba(245,245,247,.58);--glass:rgba(38,38,44,.58);--solid:#2a2a2f;--edge:rgba(255,255,255,.2);--line:rgba(255,255,255,.12);--hov:rgba(255,255,255,.1);--bar:rgba(20,20,26,.42);--under:rgba(32,32,38,.76)}
#scene{position:fixed;inset:0;width:100%;height:100%}
#desk{position:fixed;inset:0}
.g{background:var(--glass);border:.5px solid var(--edge);backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%);box-shadow:0 12px 40px rgba(20,20,40,.26),inset 0 .5px 0 rgba(255,255,255,.5)}
#mb{position:fixed;left:0;right:0;top:0;height:28px;background:var(--bar);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);display:flex;align-items:center;gap:18px;padding:0 14px;font-weight:500;z-index:50}
#mb .sp{flex:1}
#mb b{font-weight:700}
#zas{height:22px;min-width:26px;padding:0 5px;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:5px;cursor:default}
#zas:hover,#zas.on{background:var(--hov)}
#zas svg{width:17px;height:17px}
.rec-dot{width:12px;height:12px;border-radius:50%;background:#ff3b30;box-shadow:0 0 0 2px rgba(255,59,48,.25)}
svg{display:block}
#menu{position:fixed;top:32px;width:280px;border-radius:13px;padding:5px;z-index:60;display:none}
#menu .it{display:flex;align-items:center;height:26px;padding:0 9px;border-radius:7px;gap:8px}
#menu .it:hover{background:var(--acc);color:#fff}
#menu .it span{flex:1}
#menu .it kbd{font:inherit;color:var(--m)}
#menu .it:hover kbd{color:rgba(255,255,255,.8)}
#menu .it svg{width:15px;height:15px;opacity:.8}
#menu hr{border:0;border-top:.5px solid var(--line);margin:5px 9px}
#menu .lb{font-size:11px;font-weight:500;color:var(--m);padding:3px 9px 6px}
#strip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 9px 6px}
#strip div{height:50px;border-radius:7px;background:var(--hov) center/cover;box-shadow:0 0 0 .5px var(--line)}
#strip div.has:hover{box-shadow:0 0 0 2px var(--acc)}

#ov{position:fixed;inset:0;z-index:40;display:none;cursor:crosshair}
#ov>svg{position:absolute;inset:0;width:100%;height:100%}
.hd{position:absolute;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:#fff;box-shadow:0 0 3px rgba(0,0,0,.4);display:none}
#size{position:absolute;display:none;height:26px;line-height:26px;padding:0 12px;border-radius:13px;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
#hud{position:absolute;left:50%;transform:translateX(-50%);bottom:26px;display:flex;align-items:center;gap:2px;padding:6px;border-radius:14px;cursor:default}
.b{width:32px;height:32px;border:0;background:none;color:var(--t);display:grid;place-items:center;border-radius:10px;padding:0;cursor:default}
.b svg{width:17px;height:17px}
.b:hover{background:var(--hov)}
.b.on{background:var(--acc);color:#fff}
.b.on.red{background:#ff3b30}
#hud .h{color:var(--m);font-size:12px;padding:0 10px}

.card{position:fixed;z-index:30;border-radius:14px;overflow:hidden;background:#17171a center/contain no-repeat;box-shadow:0 10px 34px rgba(0,0,0,.32),0 0 0 .5px rgba(255,255,255,.3);cursor:default}
.card .acts{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;display:flex;gap:2px;padding:4px;border-radius:12px;opacity:0;transition:opacity .16s}
.card:hover .acts{opacity:1}
.card .bd{position:absolute;left:8px;bottom:8px;height:22px;line-height:22px;padding:0 10px;border-radius:11px;font-size:11px;font-weight:600;transition:opacity .16s}
.card:hover .bd{opacity:0}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);height:38px;line-height:38px;padding:0 18px;border-radius:19px;font-weight:500;z-index:70;white-space:nowrap;opacity:0;transition:opacity .16s}
.pin{position:fixed;z-index:35;border-radius:10px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.35),0 0 0 .5px rgba(255,255,255,.3);cursor:grab}
.pin img{display:block;width:100%;height:100%;pointer-events:none}
.pin .b{position:absolute;left:6px;top:6px;width:24px;height:24px;border-radius:8px;opacity:0}
.pin:hover .b{opacity:1}
#recb{position:fixed;z-index:25;border:2px solid #ff3b30;border-radius:3px;pointer-events:none;display:none}

#ed{position:fixed;z-index:55;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:14px;overflow:hidden;background:var(--under);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);box-shadow:0 26px 80px rgba(0,0,0,.42),0 0 0 .5px var(--edge);display:none}
#ed .tl{position:absolute;left:14px;top:14px;display:flex;gap:8px}
#ed .tl i{width:12px;height:12px;border-radius:50%;background:#ff5f57}
#ed .tl i+i{background:#febc2e}#ed .tl i+i+i{background:#28c840}
#tb{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:6px;border-radius:14px}
#tb .sw{width:24px;height:24px;border:0;border-radius:50%;margin:0 10px 0 8px;box-shadow:0 0 0 2px var(--solid),0 0 0 3px var(--line);padding:0}
#tb .go{height:28px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:600 13px inherit;font-family:inherit;padding:0 14px;margin-left:6px}
#vw{position:absolute;inset:62px 0 0 0;overflow:auto;display:grid}#vw>canvas{grid-area:1/1}
#lt{position:absolute;display:none;user-select:text;-webkit-user-select:text;cursor:text;border-radius:10px;overflow:hidden;background:rgba(10,132,255,.06);box-shadow:inset 0 0 0 1.5px rgba(10,132,255,.5)}
#lt span{position:absolute;color:transparent;white-space:pre;font-family:Inter,"Segoe UI",sans-serif;background:rgba(10,132,255,.1);border-radius:2px;user-select:text;-webkit-user-select:text}
#lt span::selection{background:rgba(10,132,255,.42);color:transparent}
#ec{margin:auto;display:block;border-radius:10px;cursor:crosshair;box-shadow:0 8px 28px rgba(0,0,0,.2)}
#brush{position:absolute;display:none;pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.8);z-index:2}
#zm{position:absolute;right:14px;bottom:12px;display:flex;align-items:center;gap:2px;padding:3px;border-radius:11px;z-index:2;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
#zm span{min-width:44px;text-align:center}
.b.s{width:26px;height:26px;border-radius:8px}.b.s svg{width:14px;height:14px}
#zm .t{border:0;background:none;color:var(--t);font:500 12px inherit;font-family:inherit;padding:4px 8px;border-radius:8px}#zm .t:hover{background:var(--hov)}
.b:disabled{opacity:.3}
#tb .sep{width:1px;height:20px;background:var(--line);margin:0 5px}
#sub{position:absolute;left:50%;top:66px;transform:translateX(-50%);display:none;align-items:center;gap:10px;padding:7px 14px;border-radius:12px;z-index:2;font-size:12px;font-weight:500;white-space:nowrap}
#sub input[type=range]{width:120px;accent-color:var(--acc)}
#sub b{font-weight:500;min-width:20px;text-align:right;font-variant-numeric:tabular-nums}
#sub .seg{display:flex;background:var(--hov);border-radius:7px;padding:2px}
#sub .seg button{border:0;background:none;color:var(--t);font:500 12px inherit;font-family:inherit;padding:2px 9px;border-radius:5px}
#sub .seg button.on{background:var(--solid);box-shadow:0 1px 2px rgba(0,0,0,.2)}
#sub .off{opacity:.35}
#edn{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:7px 14px;border-radius:15px;font-weight:500;opacity:0;transition:opacity .16s;pointer-events:none;z-index:3;white-space:nowrap;max-width:80%;overflow:hidden;text-overflow:ellipsis}
#savem{position:absolute;z-index:3;top:62px;width:256px;padding:5px;border-radius:13px;display:none}
#savem button{display:block;width:100%;height:28px;text-align:left;border:0;background:none;color:var(--t);font:inherit;padding:0 10px;border-radius:7px}
#savem button:hover{background:var(--acc);color:#fff}
#ocrp{position:absolute;right:14px;top:62px;bottom:56px;width:280px;border-radius:14px;padding:12px;z-index:3;display:none}
.oh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#ocrt{width:100%;height:calc(100% - 92px);resize:none;border:.5px solid var(--line);border-radius:9px;background:var(--hov);color:var(--t);font:13px/1.5 Inter,"Segoe UI",sans-serif;padding:8px;outline:0;user-select:text;-webkit-user-select:text}
#ocre{color:var(--m);display:none;margin:6px 0}
.dots{display:flex;flex-wrap:wrap;gap:3px}
.dot{width:26px;height:26px;border-radius:50%;border:0;padding:0;background:none;display:grid;place-items:center}
.dot i{display:block;width:18px;height:18px;border-radius:50%;box-shadow:0 0 0 .5px rgba(127,127,127,.6)}
.dot.on{box-shadow:0 0 0 2px var(--acc)}
.custom{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;font-weight:500}
.custom input{width:30px;height:22px;padding:0;border:0;background:none;border-radius:6px}
.sz{display:flex;align-items:center;gap:8px;margin-top:9px}
.sz .pv{width:36px;height:36px;display:grid;place-items:center;flex:none}.sz .pv i{display:block;border-radius:50%}
.sz input{flex:1;min-width:0;accent-color:var(--acc)}.sz b{font-weight:500;font-size:12px;min-width:20px;text-align:right}
.nn{color:var(--m);font-size:12px}
#cm{position:fixed;z-index:75;width:220px;padding:5px;border-radius:13px;display:none}
#cm button{display:block;width:100%;height:27px;text-align:left;border:0;background:none;color:var(--t);font:inherit;padding:0 10px;border-radius:7px}
#cm button:hover{background:var(--acc);color:#fff}
#cm .p{font-size:11px;color:var(--m);padding:4px 10px 6px;word-break:break-all;user-select:text;-webkit-user-select:text}
.path{display:flex;align-items:center;gap:8px;min-width:0}.path .k{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.mini{border:0;border-radius:6px;background:var(--hov);color:var(--t);font:500 12px inherit;font-family:inherit;padding:3px 8px;flex:none}
#txt{position:absolute;display:none;border:1px dashed var(--acc);background:none;font-family:Inter,sans-serif;font-weight:700;padding:0;line-height:1.2;outline:0;z-index:2;user-select:text;-webkit-user-select:text}
#pop{position:absolute;z-index:3;top:62px;display:none;width:236px;padding:10px;border-radius:13px}
#sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:260px;padding:20px 16px 14px;border-radius:14px;text-align:center;display:none;z-index:4}
#sheet h4{font-size:14px;font-weight:700}#sheet p{color:var(--m);margin:6px 0 14px}
.btn{display:block;width:100%;height:30px;border:0;border-radius:8px;background:var(--hov);color:var(--t);font:500 13px inherit;font-family:inherit;margin-top:6px}
.btn.p{background:var(--acc);color:#fff}

.win{position:fixed;z-index:58;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:12px;background:var(--solid);box-shadow:0 26px 80px rgba(0,0,0,.42),0 0 0 .5px var(--line);display:none}
.tlw{height:38px;display:flex;align-items:center;justify-content:center;font-weight:600;position:relative}
.tlw i{position:absolute;left:14px;width:12px;height:12px;border-radius:50%;background:#ff5f57}
.tabs{display:flex;justify-content:center;gap:4px;padding:0 0 10px}
.tabs button{border:0;background:none;color:var(--t);font:500 12px inherit;font-family:inherit;padding:5px 12px;border-radius:7px}
.tabs button.on{background:var(--hov)}
.form{background:var(--hov);border-radius:10px;margin:0 18px 18px;padding:2px 12px}
.form label{display:flex;justify-content:space-between;align-items:center;min-height:38px;border-bottom:.5px solid var(--line)}
.form label:last-child{border:0}
.sw2{appearance:none;width:32px;height:19px;border-radius:10px;background:var(--line);position:relative;transition:.15s;margin:0}
.sw2:checked{background:var(--acc)}
.sw2:after{content:"";position:absolute;width:15px;height:15px;left:2px;top:2px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:.15s}
.sw2:checked:after{left:15px}
select{font:inherit;color:inherit;background:none;border:.5px solid var(--line);border-radius:6px;padding:2px 4px}
select option{color:#000}
.k{font-weight:500;font-variant-numeric:tabular-nums;color:var(--m)}
#welcome{width:400px;text-align:center;padding:34px 44px 30px}
#welcome img{width:84px;height:84px}
.icon{width:84px;height:84px;margin:0 auto;border-radius:20px;background:#0f0f13;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.3)}
.icon svg{width:62px;height:62px}
#welcome h2{font-size:26px;letter-spacing:-.02em;margin-top:16px}
#welcome p{font-size:14px;color:var(--m);margin:8px 0 20px}
#welcome .cap{font-size:30px;font-weight:600;background:var(--hov);border-radius:14px;padding:10px 28px;display:inline-block;margin-bottom:22px}

#tp{position:fixed;left:14px;bottom:14px;width:262px;z-index:90;background:rgba(14,14,18,.9);color:#fff;border-radius:14px;padding:12px 14px;font:12px/1.35 Inter,"Segoe UI",sans-serif;box-shadow:0 10px 40px rgba(0,0,0,.4)}
#tp h3{font-size:13px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
#tp h3 span{color:#ffcc1a}
#tp .bx{margin-top:8px}
#tp ul{list-style:none;padding:0;max-height:calc(100vh - 210px);overflow:auto}
body.editing #tpb{display:none}
#tp li{padding:2.5px 0;color:#c7c7cc;display:flex;gap:7px}
#tp li i{width:13px;height:13px;border-radius:50%;box-shadow:inset 0 0 0 1px #636366;flex:none;margin-top:1px}
#tp li.ok{color:#fff}#tp li.ok i{background:#30d158;box-shadow:none}
#tp kbd{font:600 11px Inter,sans-serif;background:#2c2c30;border-radius:4px;padding:0 5px;color:#fff}
#tp .row{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
#tp button{font:500 11px Inter,sans-serif;background:#2c2c30;color:#fff;border:0;border-radius:6px;padding:4px 8px}
#tp button:hover{background:#3a3a40}
#tp .note{color:#8e8e93;font-size:11px;margin-top:8px}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="mb"><b>Finder</b><span>Archivo</span><span>Edición</span><span>Ver</span><span class="sp"></span><div id="zas"></div><span id="clock"></span></div>
<div id="menu" class="g"></div>
<div id="recb"></div>
<div id="cm" class="g"></div>

<div id="ov"><svg><path id="dim" fill="rgba(0,0,0,.3)" fill-rule="evenodd"/><rect id="fr" fill="none" stroke="#fff" stroke-width="1.5"/></svg>
<i class="hd"></i><i class="hd"></i><i class="hd"></i><i class="hd"></i><div id="size" class="g"></div><div id="hud" class="g"></div></div>

<div id="ed"><div class="tl"><i id="edClose"></i><i></i><i></i></div>
<div id="tb" class="g"></div><div id="sub" class="g"></div>
<div id="vw"><canvas id="ec"></canvas><div id="lt"></div></div>
<input id="txt" spellcheck="false" placeholder="Escribe">
<i id="brush"></i>
<div id="zm" class="g"><button class="b s" id="zo" title="Alejar (Ctrl y -)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h12"/></svg></button><span id="zv">100%</span><button class="b s" id="zi" title="Acercar (Ctrl y +)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h12M12 6v12"/></svg></button><button class="t" id="zf">Ajustar</button></div>
<div id="edn" class="g"></div>
<div id="pop" class="g"></div>
<div id="savem" class="g"><button data-sv="copy">Guardar una copia con los cambios</button><button data-sv="replace">Reemplazar el original</button><button data-sv="as">Guardar como…</button></div>
<div id="sheet" class="g"><h4>¿Cerrar sin copiar?</h4><p>Lo que dibujaste en esta captura se perderá.</p><button class="btn p" id="shC">Copiar y cerrar</button><button class="btn" id="shD">Descartar</button><button class="btn" id="shK" style="margin-top:14px">Seguir editando</button></div></div>

<div id="set" class="win" style="width:480px"><div class="tlw"><i id="setClose"></i>Ajustes de Zas</div><div class="tabs" id="tabs"></div><div id="tabb"></div></div>
<div id="wel" class="win"><div id="welcome"></div></div>

<div id="tp">
<h3>Panel de prueba <span id="prog"></span></h3>
<div class="bx" id="tpb">
<ul id="chk"></ul>
<div class="note">Teclas aquí: <kbd>2</kbd> área <kbd>1</kbd> pantalla <kbd>7</kbd> texto <kbd>8</kbd> 3 s <kbd>6</kbd> video <kbd>9</kbd> repetir. En el Mac serán ⇧⌘ más ese número. Desliza una tarjeta con dos dedos o Shift + rueda.</div>
<div class="row"><button id="tDark">Claro / oscuro</button><button id="tWel">Bienvenida</button><button id="tPer">Permiso</button><button id="tRe">Reiniciar</button><button id="tHide">Ocultar</button></div>
</div></div>

<script>

function pixelated(b){ED.pix=ED.pix||{};if(ED.pix[b])return ED.pix[b];const sw=Math.max(ED.img.w/b,1),sh=Math.max(ED.img.h/b,1),s=ce('canvas');s.width=sw;s.height=sh;s.getContext('2d').drawImage(ED.base,0,0,sw,sh);const P=ce('canvas');P.width=ED.img.w*dpr;P.height=ED.img.h*dpr;const q=P.getContext('2d');q.imageSmoothingEnabled=false;q.drawImage(s,0,0,P.width,P.height);return ED.pix[b]=P}
function boundsOf(m){const c=$('#ec').getContext('2d');if(m.t=='text'){c.save();c.font=`700 ${m.lw}px Inter,sans-serif`;const w=c.measureText(m.text).width;c.restore();return{x:m.pts[0].x,y:m.pts[0].y,w,h:m.lw*1.25}}if(m.t=='num')return{x:m.pts[0].x-m.lw,y:m.pts[0].y-m.lw,w:m.lw*2,h:m.lw*2};const xs=m.pts.map(p=>p.x),ys=m.pts.map(p=>p.y),x=Math.min(...xs),y=Math.min(...ys);return{x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y}}
function hitMark(m,p){if(['erase','cropset','crop'].includes(m.t))return false;const b=boundsOf(m),k=Math.max(m.lw/2,6)+3;if(p.x<b.x-k||p.x>b.x+b.w+k||p.y<b.y-k||p.y>b.y+b.h+k)return false;if(m.t=='arrow'||m.t=='pen'||m.t=='hl'||(m.t=='blur'&&m.brush)){for(let i=1;i<m.pts.length;i++){if(segDist(p,m.pts[i-1],m.pts[i])<=k)return true}return false}return true}
function segDist(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy,t=l?Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/l)):0;return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)}
function startDrag(p){const reach=10/ED.zoom,s=ED.marks[ED.sel];if(s){const b=boundsOf(s),cs=[[b.x,b.y],[b.x+b.w,b.y],[b.x+b.w,b.y+b.h],[b.x,b.y+b.h]],i=cs.findIndex(c=>Math.hypot(c[0]-p.x,c[1]-p.y)<=reach);if(i>=0){ED.drag={kind:'size',anchor:cs[(i+2)%4],start:cs[i],orig:JSON.parse(JSON.stringify(s))};return true}if(p.x>=b.x-6&&p.x<=b.x+b.w+6&&p.y>=b.y-6&&p.y<=b.y+b.h+6){ED.drag={kind:'move',last:p};return true}}if(ED.tool=='move'){for(let i=ED.marks.length-1;i>=0;i--){if(hitMark(ED.marks[i],p)){ED.sel=i;ED.drag={kind:'move',last:p};renderEd();return true}}}return false}
function moveDrag(p){const d=ED.drag,m=ED.marks[ED.sel];if(!m)return;if(d.kind=='move'){const dx=p.x-d.last.x,dy=p.y-d.last.y;m.pts=m.pts.map(q=>({x:q.x+dx,y:q.y+dy}));d.last=p}else{const[ax,ay]=d.anchor,w=d.start[0]-ax,h=d.start[1]-ay,sx=Math.abs(w)>1?(p.x-ax)/w:1,sy=Math.abs(h)>1?(p.y-ay)/h:1;if(m.t=='text'||m.t=='num'){const f=Math.max(Math.abs(sx),Math.abs(sy),.2),o=d.orig.pts[0];m.pts=[{x:ax+(o.x-ax)*f,y:ay+(o.y-ay)*f}];m.lw=d.orig.lw*f}else m.pts=d.orig.pts.map(q=>({x:ax+(q.x-ax)*sx,y:ay+(q.y-ay)*sy}))}tick('mover');renderEd()}
function isLight(h){const n=parseInt(h.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return r*.3+g*.59+b*.11>170}
const ec=$('#ec');
function imgPt(e){const b=ec.getBoundingClientRect(),r=view();return{x:(e.clientX-b.left)/ED.zoom+r.x,y:(e.clientY-b.top)/ED.zoom+r.y}}
ec.ondblclick=e=>{const p=imgPt(e);for(let i=ED.marks.length-1;i>=0;i--){const m=ED.marks[i];if(m.t=='text'&&hitMark(m,p)){ED.marks.splice(i,1);ED.sel=null;const c=ED.color,z=ED.size.text;ED.color=m.color;ED.size.text=m.lw;startText(m.pts[0]);$('#txt').value=m.text;ED.color=c;ED.size.text=z;renderEd();return}}};
ec.onpointerdown=e=>{$('#pop').style.display='none';closeSave();commitText();const p=imgPt(e),t=ED.tool;ec.setPointerCapture(e.pointerId);if(startDrag(p))return;ED.sel=null;if(t=='move')return renderEd();if(t=='num'){pushM({t:'num',color:ED.color,lw:ED.size.num,pts:[p],n:ED.num++});return}if(t=='text')return startText(p);ED.cur={t,color:t=='hl'?ED.marker:ED.color,lw:ED.size[t],pts:[p],brush:t=='blur'&&ED.blurBrush,block:ED.block};if(t=='hl')tick('hl');if(t=='erase')tick('erase');if(t=='blur')tick('censor')};

ec.onpointermove=e=>{const d=$('#brush'),t=ED.tool;if(['pen','hl','erase'].includes(t)||(t=='blur'&&ED.blurBrush)){const s=ED.size[t]*ED.zoom,E=$('#ed').getBoundingClientRect();d.style.cssText=`display:block;width:${s}px;height:${s}px;left:${e.clientX-E.left-s/2}px;top:${e.clientY-E.top-s/2}px;border-radius:${t=='hl'?'3px':'50%'}`}else d.style.display='none';if(ED.drag)return moveDrag(imgPt(e));if(!ED.cur)return;const p=imgPt(e);if(FREE(ED.cur))ED.cur.pts.push(p);else ED.cur.pts[1]=p;renderEd()};

ec.onpointerup=()=>{if(ED.drag){ED.drag=null;renderEd();return}const m=ED.cur;ED.cur=null;if(!m)return;if(m.pts.length<2)return renderEd();if(m.t=='crop'){const[a,b]=m.pts,r={x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(a.x-b.x),h:Math.abs(a.y-b.y)};if(r.w<8||r.h<8)return renderEd();ED.marks.push({t:'cropset',r,pts:[]});ED.redo=[];tick('crop');pickTool('arrow');fitZoom();return}pushM(m)};
$('#vw').addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();setZoom(ED.zoom*(e.deltaY<0?1.12:.89))},{passive:false});
function pushM(m){ED.marks.push(m);ED.redo=[];ED.sel=['pen','hl','erase'].includes(m.t)?null:ED.marks.length-1;renderEd()}
function undo(){commitText();ED.sel=null;const m=ED.marks.pop();if(!m)return;ED.redo.push(m);if(m.t=='num')ED.num--;m.t=='cropset'?fitZoom():renderEd()}
function redo(){ED.sel=null;const m=ED.redo.pop();if(!m)return;ED.marks.push(m);if(m.t=='num')ED.num++;m.t=='cropset'?fitZoom():renderEd()}

function startText(p){const t=$('#txt'),b=ec.getBoundingClientRect(),E=$('#ed').getBoundingClientRect(),r=view();ED.edit={p};const s=ED.size.text*ED.zoom;t.value='';t.style.cssText=`display:block;left:${b.left-E.left+(p.x-r.x)*ED.zoom}px;top:${b.top-E.top+(p.y-r.y)*ED.zoom}px;font-size:${s}px;color:${ED.color};width:${s*5}px;height:${s*1.35}px`;setTimeout(()=>t.focus(),0)}
function commitText(){if(!ED.edit)return;const t=$('#txt'),v=t.value.trim(),p=ED.edit.p;ED.edit=null;t.style.display='none';if(v){pushM({t:'text',color:ED.color,lw:ED.size.text,pts:[p],text:v});tick('txtk')}}
$('#txt').oninput=()=>{const t=$('#txt');t.style.width=Math.max(parseFloat(t.style.fontSize)*5,t.scrollWidth+8)+'px'};

function exportCanvas(){commitText();buildLayer();const r=view(),c=ce('canvas');c.width=r.w*dpr;c.height=r.h*dpr;compose(c.getContext('2d'),1,r,dpr);return{c,r}}

function edNote(t){const n=$('#edn');n.textContent=t;n.style.opacity=1;clearTimeout(n._t);n._t=setTimeout(()=>n.style.opacity=0,1500)}
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}.${p(d.getMinutes())}.${p(d.getSeconds())}`}
function saveEd(mode){closeSave();const{c}=exportCanvas(),url=c.toDataURL('image/png');const base=(ED.src.path||'').split('/').pop().replace(/\.png$/,'')||`Zas ${stamp()}`;let name;if(mode=='copy')name=`${base} anotada.png`;if(mode=='replace'){name=`${base}.png`;ED.src.url=url}if(mode=='as'){name=prompt('Guardar como:',`${base} anotada.png`);if(!name)return;const a=ce('a');a.href=url;a.download=name;a.click()}tick('savec');edNote(mode=='replace'?'Original reemplazado':`Guardado en ${folderFor('shot')}/${name}`);ED.savedAt=ED.marks.length}

function visibleItems(){const s=ED.src.rect;if(!s)return[];const r=view();return textItems().map(i=>({...i,x:i.x-s.x,y:i.y-s.y})).filter(i=>{const cx=i.x+i.w/2,cy=i.y+i.h/2;return cx>=r.x&&cx<=r.x+r.w&&cy>=r.y&&cy<=r.y+r.h})}

const TABS={General:()=>`<label>Abrir Zas al iniciar sesión<input type="checkbox" class="sw2" data-s="login" ${S.login?'checked':''}></label><label>Sonido al capturar<input type="checkbox" class="sw2" data-s="sound" ${S.sound?'checked':''}></label><label>Mostrar miniatura durante<select data-n="secs">${[3,6,10,30].map(v=>`<option value="${v}" ${S.secs==v?'selected':''}>${v} segundos</option>`).join('')}</select></label><label>Guardar una copia de cada captura<input type="checkbox" class="sw2" data-s="save" ${S.save?'checked':''}></label><label>Capturas y videos<span class="path"><span class="k">${S.folder}</span><button class="mini" data-go="Capturas">Ver</button></span></label><label>Versión 0.7.0<span class="k">Copiar comando para actualizar</span></label>`,Atajos:()=>[['Capturar área o ventana','⇧⌘2'],['Repetir la última captura','⇧⌘9'],['Capturar pantalla','⇧⌘1'],['Capturar en 3 segundos','⇧⌘8'],['Copiar texto de la pantalla','⇧⌘7'],['Grabar video','⇧⌘6']].map(r=>`<label>${r[0]}<span class="k">${r[1]}</span></label>`).join(''),Video:()=>`<label>Al terminar, copiar<select data-b="summary"><option value="1" ${S.summary?'selected':''}>Resumen en imágenes</option><option value="0" ${S.summary?'':'selected'}>Archivo de video</option></select></label><label>Tomar una imagen cada<select data-n="every">${[[1,'1 segundo'],[2,'2 segundos'],[5,'5 segundos'],[10,'10 segundos'],[30,'30 segundos'],[60,'1 minuto']].map(o=>`<option value="${o[0]}" ${S.every==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label><label>Detener la grabación a los<select data-n="limit">${[[0,'Sin límite'],[10,'10 segundos'],[30,'30 segundos'],[60,'1 minuto'],[300,'5 minutos']].map(o=>`<option value="${o[0]}" ${S.limit==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label><label>Grabar con micrófono<input type="checkbox" class="sw2" data-s="mic" ${S.mic?'checked':''}></label>`};
function setTab(t){$('#tabs').innerHTML=Object.keys(TABS).map(k=>`<button class="${k==t?'on':''}">${k}</button>`).join('');$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>setTab(b.textContent));$('#tabb').innerHTML=`<div class="form">${TABS[t]()}</div>`;$('#tabb').querySelectorAll('[data-go]').forEach(b=>b.onclick=e=>{e.preventDefault();toast('Aquí se abriría Finder en la carpeta de '+b.dataset.go.toLowerCase()+'.')});$('#tabb').querySelectorAll('[data-s]').forEach(i=>i.onchange=()=>S[i.dataset.s]=i.checked);$('#tabb').querySelectorAll('[data-n]').forEach(i=>i.onchange=()=>S[i.dataset.n]=+i.value);$('#tabb').querySelectorAll('[data-b]').forEach(i=>i.onchange=()=>S[i.dataset.b]=i.value=='1')}

addEventListener('keydown',e=>{const ed=$('#ed').style.display=='block';
