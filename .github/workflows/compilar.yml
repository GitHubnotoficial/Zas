name: Compilar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      ZAS_CERT_P12: ${{ secrets.ZAS_CERT_P12 }}
      ZAS_CERT_PASSWORD: ${{ secrets.ZAS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Versiones
        run: |
          sw_vers
          uname -m
          xcrun swiftc --version

      - name: Preparar firma
        run: |
          KEYCHAIN="$RUNNER_TEMP/zas.keychain-db"
          PASSWORD="$(uuidgen)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          echo "$ZAS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/zas.p12"
          security import "$RUNNER_TEMP/zas.p12" -k "$KEYCHAIN" -P "$ZAS_CERT_PASSWORD" -T /usr/bin/codesign -f pkcs12
          rm "$RUNNER_TEMP/zas.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          ID="$(security find-identity -p codesigning "$KEYCHAIN" | awk '$1 == "1)" { print $2; exit }')"
          echo "ZAS_SIGN_ID=$ID" >> "$GITHUB_ENV"

      - name: Compilar la app
        run: bash compilar.sh

      - name: Compilar las pruebas
        run: |
          xcrun swiftc -swift-version 5 -sdk "$(xcrun --show-sdk-path)" \
            -D ZAS_TEST -o build/ZasPruebas Sources/*.swift Tests/*.swift

      - name: Dar permisos para las pruebas
        run: |
          DB="/Library/Application Support/com.apple.TCC/TCC.db"
          NOW="$(date +%s)"
          for CLIENT in "local.zas.app:0" "$PWD/build/ZasPruebas:1"; do
            NAME="${CLIENT%:*}"; TYPE="${CLIENT##*:}"
            sudo sqlite3 "$DB" "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,flags,last_modified) VALUES ('kTCCServiceScreenCapture','$NAME',$TYPE,2,4,1,0,$NOW);"
          done

      - name: Correr las pruebas
        run: |
          mkdir -p escenas
          cp build/icono.png escenas/icono.png
          ./build/ZasPruebas "$PWD/escenas"

      - name: La app arranca
        run: |
          cp -R build/Zas.app /Applications/Zas.app
          open /Applications/Zas.app
          sleep 6
          pgrep -xl Zas
          screencapture -x escenas/app-en-marcha.png
          pkill -x Zas

      - name: Usar la app de verdad
        run: |
          xcrun swiftc -swift-version 5 -sdk "$(xcrun --show-sdk-path)" -o build/ZasConductor Tests/Driver/main.swift
          DB="/Library/Application Support/com.apple.TCC/TCC.db"
          USERDB="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          NOW="$(date +%s)"
          for SERVICE in kTCCServiceAccessibility kTCCServicePostEvent; do
            sudo sqlite3 "$DB" "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,flags,last_modified) VALUES ('$SERVICE','$PWD/build/ZasConductor',1,2,4,1,0,$NOW);"
          done
          sudo sqlite3 "$USERDB" "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,flags,last_modified) VALUES ('kTCCServicePostEvent','$PWD/build/ZasConductor',1,2,4,1,0,$NOW);" || true
          defaults write local.zas.app welcomed -bool true
          open /Applications/Zas.app
          sleep 4
          ./build/ZasConductor "$PWD/escenas"

      - name: Empaquetar
        run: |
          ditto -c -k --keepParent build/Zas.app build/Zas-app.zip
          lipo -info build/Zas.app/Contents/MacOS/Zas

      # Solo se llega aquí si la compilación y todas las pruebas pasaron.
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(grep '^VERSION=' compilar.sh | cut -d'"' -f2)"
          cp build/Zas-app.zip build/Zas.zip
          if ! gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release create "v$VERSION" --title "Zas $VERSION" --latest --notes "Capturas y video para Mac. Instrucciones en el LEEME."
          fi
          gh release upload "v$VERSION" build/Zas.zip --clobber

      - name: El instalador de un comando funciona
        run: |
          pkill -x Zas || true
          rm -rf /Applications/Zas.app
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/instalar-rapido.sh" | bash
          sleep 5
          pgrep -xl Zas
          codesign --display --requirements - /Applications/Zas.app
          xattr /Applications/Zas.app

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: escenas
          path: escenas
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: Zas-app
          path: build/Zas-app.zip
          if-no-files-found: error
